name: Android CI Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/26.3.11579264
          key: ndk-26.3.11579264

      - name: Install Android NDK & CMake
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Configure Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from repository secrets..."
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/release.jks"
            echo "KEYSTORE_PATH=${{ github.workspace }}/release.jks" >> "$GITHUB_ENV"
            echo "Release keystore configured successfully."
          else
            echo "No RELEASE_KEYSTORE_BASE64 secret provided. Creating debug keystore for fallback signing..."
            mkdir -p ~/.android
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Debug keystore created successfully."
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK with Gradle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Prepare Artifacts & Checksums
        run: |
          mkdir -p dist
          SHORT_SHA="${GITHUB_SHA::7}"

          cp app/build/outputs/apk/release/app-release.apk "dist/BitLockerDroid-release-${SHORT_SHA}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/BitLockerDroid-debug-${SHORT_SHA}.apk"

          cd dist
          sha256sum BitLockerDroid-*.apk > checksums.txt
          cd ..

          echo "Artifacts generated in dist/:"
          ls -lh dist/
          echo "Checksums:"
          cat dist/checksums.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BitLockerDroid-APKs-${{ github.sha }}
          path: dist/*
          retention-days: 30
